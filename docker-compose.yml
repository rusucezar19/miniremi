# Certificate Tracker + self-hosted ntfy.
# Usage: cp .env.example .env, edit it, then: docker compose up -d --build
name: certtracker

services:
  app:
    build: .
    image: certtracker:latest
    container_name: certtracker
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${APP_HOST_PORT:-8085}:${PORT:-8080}"
    volumes:
      - ./data:/data
    depends_on:
      ntfy:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.environ.get('PORT','8080'), timeout=4)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

  ntfy:
    image: binwiederhier/ntfy:v2.38.2
    container_name: certtracker-ntfy
    command: serve
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Europe/Bucharest}
      # Public address phones use. Set NTFY_PUBLIC_URL in .env (overrides base-url in server.yml).
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL}
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ./ntfy/data:/var/lib/ntfy
    ports:
      - "${NTFY_HOST_PORT:-8095}:2586"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:2586/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<form method="post" action="/login" class="panel narrow form">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next }}">
  <h1>Log in</h1>
  {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
  <label class="field"><span>Username</span><input name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" required autofocus></label>
  <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
  <div class="form-actions"><button class="btn primary" type="submit">Log in</button></div>
</form>
{% endblock %}
